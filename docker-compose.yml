version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: medical_ai_backend
    # The .env file in the backend folder will automatically be used if python-dotenv is set up,
    # or you can explicitly load it here:
    # env_file:
    #   - ./backend/.env

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    container_name: medical_ai_frontend
